<!DOCTYPE html>
<html>
<head>
    <title>Room {{ room_name }} — Silent Talk</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #080c10;
            color: #e8f0f8;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 56px 1fr;
            overflow: hidden;
        }

        /* ── TOPBAR ── */
        .topbar {
            grid-column: 1 / -1;
            background: rgba(8,12,16,0.95);
            border-bottom: 1px solid #1e2d40;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
        }
        .topbar-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: #e8f0f8;
        }
        .topbar-sep { color: #1e2d40; }
        .room-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            color: #00d4ff;
            background: rgba(0,212,255,0.08);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 3px 10px;
            border-radius: 100px;
            letter-spacing: 0.06em;
        }
        .connected-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #4a6070;
            margin-left: auto;
        }
        .conn-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #4a6070;
            transition: all 0.3s;
        }
        .conn-dot.live {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; } 50% { opacity:0.4; }
        }
        .leave-btn {
            padding: 5px 14px;
            border-radius: 8px;
            background: rgba(255,69,103,0.1);
            border: 1px solid rgba(255,69,103,0.2);
            color: #ff4567;
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .leave-btn:hover { background: rgba(255,69,103,0.2); }

        /* ── LEFT: CAMERA PANEL ── */
        .camera-section {
            background: #080c10;
            border-right: 1px solid #1e2d40;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 0.75rem;
            overflow: hidden;
        }

        .section-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            color: #4a6070;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .video-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: #0d1117;
            border: 1px solid #1e2d40;
            flex-shrink: 0;
        }

        #video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
            max-height: 260px;
            object-fit: cover;
        }

        .live-letter {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0,212,255,0.7);
        }

        .hold-bar-wrap {
            height: 3px;
            background: #1e2d40;
            border-radius: 2px;
            overflow: hidden;
        }
        .hold-bar {
            height: 100%;
            background: #00ff88;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 8px rgba(0,255,136,0.5);
        }

        /* Building word display */
        .building-word {
            background: #0d1117;
            border: 1px solid #1e2d40;
            border-radius: 10px;
            padding: 10px 14px;
            font-family: 'DM Mono', monospace;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            color: #00d4ff;
            min-height: 44px;
        }

        .cam-actions {
            display: flex;
            gap: 6px;
        }

        .cam-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex: 1;
        }
        .btn-send-sign {
            background: #00d4ff;
            color: #000;
            font-weight: 600;
        }
        .btn-send-sign:hover { background: #fff; }
        .btn-space {
            background: #1a2436;
            border: 1px solid #1e2d40;
            color: #e8f0f8;
        }
        .btn-clear {
            background: rgba(255,69,103,0.1);
            border: 1px solid rgba(255,69,103,0.2);
            color: #ff4567;
        }

        /* ── RIGHT: CHAT PANEL ── */
        .chat-section {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid #1e2d40;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .messages::-webkit-scrollbar { width: 3px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #1e2d40; border-radius: 2px; }

        /* Chat bubbles */
        .bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: bubbleIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes bubbleIn {
            from { opacity:0; transform: scale(0.85) translateY(8px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }

        .bubble-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .bubble-wrap.theirs { align-self: flex-start; align-items: flex-start; }
        .bubble-wrap.system { align-self: center; }

        .bubble-sender {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: #4a6070;
            margin-bottom: 3px;
            padding: 0 4px;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Mine — typed text */
        .bubble.mine-text {
            background: #1a2436;
            border: 1px solid #243548;
            color: #e8f0f8;
            border-bottom-right-radius: 4px;
        }

        /* Theirs — signed text */
        .bubble.theirs-sign {
            background: rgba(0,212,255,0.08);
            border: 1px solid rgba(0,212,255,0.2);
            color: #00d4ff;
            border-bottom-left-radius: 4px;
        }

        /* Theirs — typed text */
        .bubble.theirs-text {
            background: #0d1117;
            border: 1px solid #1e2d40;
            color: #e8f0f8;
            border-bottom-left-radius: 4px;
        }

        /* My signed text */
        .bubble.mine-sign {
            background: rgba(0,255,136,0.08);
            border: 1px solid rgba(0,255,136,0.2);
            color: #00ff88;
            border-bottom-right-radius: 4px;
        }

        /* System message */
        .bubble.system {
            background: transparent;
            border: none;
            color: #4a6070;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            text-align: center;
        }

        .bubble-emotion {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #4a6070;
            font-family: 'DM Mono', monospace;
            padding: 0 4px;
        }

        .bubble-time {
            font-size: 0.65rem;
            color: #4a6070;
            font-family: 'DM Mono', monospace;
            padding: 0 4px;
        }

        /* ── TYPING PANEL ── */
        .type-panel {
            border-top: 1px solid #1e2d40;
            padding: 0.875rem 1rem;
            background: #080c10;
        }

        .type-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: #4a6070;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .type-row {
            display: flex;
            gap: 6px;
        }

        #hearingInput {
            flex: 1;
            padding: 10px 14px;
            background: #0d1117;
            border: 1px solid #1e2d40;
            border-radius: 10px;
            color: #e8f0f8;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #hearingInput:focus { border-color: #00d4ff; }

        .send-btn {
            padding: 10px 18px;
            background: #00d4ff;
            border: none;
            border-radius: 10px;
            color: #000;
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .send-btn:hover { background: #fff; }
    </style>
</head>
<body>

<!-- ── TOPBAR ── -->
<div class="topbar">
    <span class="topbar-logo">Silent Talk</span>
    <span class="topbar-sep">|</span>
    <span class="room-badge">room: {{ room_name }}</span>
    <div class="connected-badge">
        <span class="conn-dot" id="connDot"></span>
        <span id="connText">Connecting...</span>
    </div>
    <a class="leave-btn" href="/conversation/">Leave Room</a>
</div>

<!-- ── LEFT: CAMERA ── -->
<div class="camera-section">
    <div class="section-label">Your signing (deaf user)</div>

    <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" width="640" height="480" style="display:none"></canvas>
        <div class="live-letter" id="liveLetter">–</div>
    </div>

    <div class="hold-bar-wrap">
        <div class="hold-bar" id="holdBar"></div>
    </div>

    <div class="section-label">Building word</div>
    <div class="building-word" id="buildingWord">Start signing...</div>

    <div class="cam-actions">
        <button class="cam-btn btn-space" id="spaceBtn">Space</button>
        <button class="cam-btn btn-send-sign" id="sendSignBtn">Send ✋</button>
        <button class="cam-btn btn-clear" id="clearBtn">Clear</button>
    </div>
</div>

<!-- ── RIGHT: CHAT ── -->
<div class="chat-section">
    <div class="chat-header">
        <span class="chat-title">Conversation</span>
        <span style="font-family:'DM Mono',monospace;font-size:0.72rem;color:#4a6070;">
            Share code <strong style="color:#00d4ff">{{ room_name }}</strong> with other person
        </span>
    </div>

    <div class="messages" id="messages">
        <div class="bubble-wrap system">
            <div class="bubble system">Waiting for the other person to join...</div>
        </div>
    </div>

    <div class="type-panel">
        <div class="type-label">Hearing user — type here</div>
        <div class="type-row">
            <input type="text" id="hearingInput" placeholder="Type your message...">
            <button class="send-btn" id="sendTextBtn">
                Send
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const ROOM_NAME      = "{{ room_name }}";
const MY_NAME        = "{{ user.username|default:'Signer' }}";
const HOLD_THRESHOLD = 15;

// ── STATE ─────────────────────────────────────────────────
let sentence    = "";
let lastLetter  = "";
let sameCount   = 0;
let currentEmotion = "neutral";
let wsReady     = false;

// ── WEBSOCKET ─────────────────────────────────────────────
const wsUrl = `ws://${window.location.host}/ws/conversation/${ROOM_NAME}/`;
const ws    = new WebSocket(wsUrl);

ws.onopen = function() {
    wsReady = true;
    document.getElementById('connDot').classList.add('live');
    document.getElementById('connText').textContent = 'Connected';
};

ws.onclose = function() {
    wsReady = false;
    document.getElementById('connDot').classList.remove('live');
    document.getElementById('connText').textContent = 'Disconnected';
    addBubble("Connection lost. Please refresh.", "System", "system", "");
};

ws.onerror = function() {
    document.getElementById('connText').textContent = 'Error';
};

ws.onmessage = function(e) {
    const data = JSON.parse(e.data);
    addBubble(data.message, data.sender, data.msg_type, data.emotion);
};

// ── ADD BUBBLE ────────────────────────────────────────────
function addBubble(message, sender, msgType, emotion) {
    const container = document.getElementById('messages');
    const isMe      = sender === MY_NAME;
    const isSystem  = msgType === "system";

    const wrap = document.createElement('div');
    wrap.className = `bubble-wrap ${isSystem ? 'system' : isMe ? 'mine' : 'theirs'}`;

    let bubbleClass = 'bubble ';
    if      (isSystem)              bubbleClass += 'system';
    else if (isMe && msgType === 'sign')    bubbleClass += 'mine-sign';
    else if (isMe && msgType === 'text')    bubbleClass += 'mine-text';
    else if (!isMe && msgType === 'sign')   bubbleClass += 'theirs-sign';
    else                                     bubbleClass += 'theirs-text';

    const signIcon = msgType === 'sign' ? '✋ ' : '';
    const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    wrap.innerHTML = `
        ${!isSystem ? `<div class="bubble-sender">${sender}</div>` : ''}
        <div class="${bubbleClass}">${signIcon}${message}</div>
        ${emotion && emotion !== 'neutral' ? `<div class="bubble-emotion">${getEmotionDisplay(emotion)}</div>` : ''}
        ${!isSystem ? `<div class="bubble-time">${now}</div>` : ''}
    `;

    container.appendChild(wrap);
    container.scrollTop = container.scrollHeight;
}

function getEmotionDisplay(emotion) {
    const map = {
        "happy": "😊 happy", "sad": "😢 sad",
        "urgent": "😰 urgent", "surprised": "😮 surprised"
    };
    return map[emotion] || "";
}

// ── SEND MESSAGE ──────────────────────────────────────────
function sendMessage(message, msgType) {
    if (!wsReady || !message.trim()) return;
    ws.send(JSON.stringify({
        message:   message,
        sender:    MY_NAME,
        msg_type:  msgType,
        emotion:   currentEmotion
    }));
}

// ── WEBCAM ────────────────────────────────────────────────
navigator.mediaDevices.getUserMedia({video: true})
    .then(stream => {
        document.getElementById('video').srcObject = stream;
    })
    .catch(() => {
        document.getElementById('buildingWord').textContent = 'Camera error';
    });

// ── AJAX PREDICTION LOOP ──────────────────────────────────
setInterval(function() {
    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (!video.srcObject) return;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, 640, 480);
    const frameData = canvas.toDataURL('image/jpeg', 0.6);

    $.post('/predict/', {frame: frameData}, function(data) {
        if (data.letter) {
            document.getElementById('liveLetter').textContent = data.letter;

            if (data.letter === lastLetter) {
                sameCount++;
                const pct = Math.min((sameCount / HOLD_THRESHOLD) * 100, 100);
                document.getElementById('holdBar').style.width = pct + '%';
                if (sameCount === HOLD_THRESHOLD) {
                    sentence += data.letter;
                    document.getElementById('buildingWord').textContent = sentence;
                    sameCount = 0;
                    document.getElementById('holdBar').style.width = '0%';
                }
            } else {
                lastLetter = data.letter;
                sameCount  = 0;
                document.getElementById('holdBar').style.width = '0%';
            }
        } else {
            document.getElementById('liveLetter').textContent = '–';
            sameCount = 0;
            document.getElementById('holdBar').style.width = '0%';
        }

        if (data.emotion) currentEmotion = data.emotion;
    });
}, 200);

// ── BUTTONS ───────────────────────────────────────────────
document.getElementById('spaceBtn').onclick = function() {
    sentence += ' ';
    document.getElementById('buildingWord').textContent = sentence;
};

document.getElementById('clearBtn').onclick = function() {
    sentence = '';
    lastLetter = '';
    sameCount  = 0;
    document.getElementById('buildingWord').textContent = 'Start signing...';
    document.getElementById('holdBar').style.width = '0%';
};

document.getElementById('sendSignBtn').onclick = function() {
    const text = sentence.trim();
    if (!text) return;
    sendMessage(text, 'sign');
    sentence = '';
    lastLetter = '';
    sameCount  = 0;
    document.getElementById('buildingWord').textContent = 'Start signing...';
    document.getElementById('holdBar').style.width = '0%';
};

document.getElementById('sendTextBtn').onclick = function() {
    const input = document.getElementById('hearingInput');
    const text  = input.value.trim();
    if (!text) return;
    sendMessage(text, 'text');
    input.value = '';
};

document.getElementById('hearingInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('sendTextBtn').click();
});
</script>
</body>
</html>
